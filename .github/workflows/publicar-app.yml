# Publica en GitHub Pages SOLO los HTML de la app.
#
# Por qué existe: con el origen "Deploy from a branch", Pages sirve el repo
# entero como sitio web — los .sql de supabase/, CLAUDE.md, las skills — en una
# URL pública. Acá se arma una carpeta con lo único que el navegador necesita.
# Agregar un archivo nuevo al sitio = agregarlo a la lista de abajo, a propósito
# (misma idea que netlify.toml).
#
# Para que tenga efecto, en GitHub: Settings → Pages → Source → "GitHub Actions".
# Mientras eso no se cambie, este flujo no corre solo (solo a mano) y el sitio
# sigue publicándose como antes.
name: Publicar la app (solo los HTML)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llegan dos pushes seguidos, la segunda espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar la carpeta que se publica
        run: |
          mkdir -p _site
          # index.html = la Gestión · copiloto-cesar.html = copiloto de ventas
          # cotizador-*.html = redirecciones de 1 KB para los links viejos
          cp index.html copiloto-cesar.html cotizador-clientes.html cotizador-interno.html _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
